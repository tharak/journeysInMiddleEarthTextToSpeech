[project]
name = "jime-narrador"
version = "1.0.0"
description = "Offline automatic narrator for the Journeys in Middle-earth companion app"
requires-python = ">=3.12,<3.14"   # 3.14 has no wheels for onnxruntime yet
license = { text = "MIT" }

dependencies = [
    "UnityPy",              # phase 1: extract the corpus from the AssetBundles
    "rapidfuzz>=3.0",       # phase 3: fuzzy matching
    "num2words",            # numbers spelled out (otherwise the TTS reads them in Spanish)
    "pillow",               # image cropping before OCR
]

# `jime` as a command, so the docs can say `jime render` and mean it. Without
# this the entry point is `python jime.py` from inside the clone, which is what
# every message in the program used to tell people to type.
[project.scripts]
jime = "jime:main"

[project.optional-dependencies]
# Speech synthesis. Light: a 60 MB voice, on the CPU. The engine this replaced
# pulled in torch and ~3 GB of weights and wanted a GPU to be viable at all.
tts = ["piper-tts>=1.6"]
# OCR and capture are per platform, and the marker picks — asking the installer
# to choose was a mistake that cost a Windows session: `.[ocr]` there pulled
# ocrmac, whose pyobjc-framework-Vision has no Windows wheel and dies compiling.
# One command now works everywhere: pip install -e '.[tts,ocr,capture]'
#
# Apple Vision is native, offline and ~150 ms; Windows.Media.Ocr is native,
# offline and ~25 ms; RapidOCR is ~19 MB of ONNX, runs anywhere, and is the
# fallback for when neither native engine is available — measured at 539 ms
# against Windows.Media.Ocr's 25 ms on the same crop, so it is a fallback and
# not an alternative. ScreenCaptureKit is the only macOS 26 API that still sees
# windows; Windows.Graphics.Capture is its counterpart, and is required there
# because BitBlt and PrintWindow return black frames for a Unity window.
#
# The winrt-* packages are the Python bindings for Windows.Media.Ocr, one per
# namespace touched. The recogniser itself is not here and cannot be: it is a
# Windows optional feature the user installs per language.
ocr = [
    "ocrmac; sys_platform == 'darwin'",
    "rapidocr-onnxruntime; sys_platform != 'darwin'",
    "winrt-runtime; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
    "winrt-Windows.Globalization; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
]
capture = [
    "pyobjc-framework-ScreenCaptureKit; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "windows-capture; sys_platform == 'win32'",
    "python-xlib; sys_platform == 'linux'",
]

[tool.setuptools]
# Every module the installed program can reach, which is not the same as
# every module it imports: `jime check`, `jime extract` and the rest run
# their worker by FILENAME through subprocess (jime._run), so those files
# have to be installed even though no `import` names them.
py-modules = ["batch",
              "check_pace",
              "console",
              "glyphs",
              "i18n",
              "jime",
              "live",
              "matcher",
              "menu",
              "narrator",
              "phase1_extract",
              "phase2_render",
              "player",
              "prosody",
              "selftest",
              "trigger",
              "voices"]
packages = ["capture", "ocr"]
